<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSpot · Encuentra tu sitio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="map_style.css">
</head>

<body>

    <div class="app-container">
        <!-- Sidebar / Overlay -->
        <div class="sidebar">
            <div class="header">
                <div class="logo">GeoSpot</div>
                <p class="subtitle">Descubre lo mejor a tu alrededor</p>
            </div>

            <div class="controls">
                <button id="btn-locate" class="btn-primary">
                    <i class="fa-solid fa-location-crosshairs"></i> Mi Ubicación
                </button>
                <div class="filter-group">
                    <button class="filter-chip active" data-type="all">Todo</button>
                    <button class="filter-chip" data-type="restaurant">Restaurantes</button>
                    <button class="filter-chip" data-type="cafe">Cafés</button>
                    <button class="filter-chip" data-type="bar">Bares</button>
                </div>
            </div>

            <div id="poi-list" class="poi-list">
                <!-- POI items will be injected here -->
                <div class="empty-state">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <p>Haz clic en "Mi Ubicación" para empezar</p>
                </div>
            </div>
        </div>

        <!-- Map Container -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="map_app.js"></script>
</body>

</html>
